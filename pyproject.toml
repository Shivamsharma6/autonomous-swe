[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-swe"
version = "0.2.0"
description = "Autonomous Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "langgraph",
    "langchain",
    "pytest",
    "websockets",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "agents*",
    "workflows*",
    "tools*",
    "execution*",
    "knowledge*",
    "policies*",
    "evaluation*",
    "observability*",
    "infrastructure*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
