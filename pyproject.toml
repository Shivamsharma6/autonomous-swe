[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-swe"
version = "0.2.0"
description = "Autonomous Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<1",
    "docker>=7.2,<8",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp>=1.44,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
    "opentelemetry-instrumentation-redis>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "opentelemetry-sdk>=1.44,<2",
    "prometheus-client>=0.24,<1",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-multipart>=0.0.22,<1",
    "redis>=7.4,<9",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "structlog>=25.5,<26",
    "uvicorn[standard]>=0.52,<1",
    "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.140,<7",
    "mypy>=1.19,<2",
    "pip-tools>=7.5,<8",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
    "testcontainers[postgres,redis]>=4.13,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "agents*",
    "workflows*",
    "tools*",
    "execution*",
    "knowledge*",
    "policies*",
    "evaluation*",
    "observability*",
    "infrastructure*",
    "domain*",
    "planning*",
    "persistence*",
    "messaging*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
