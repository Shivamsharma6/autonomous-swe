<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Vault - Video Game Database</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-glow"></div>

    <div class="app-layout">
        <!-- Header -->
        <header class="navbar glass-card">
            <div class="nav-brand">
                <div class="nav-icon">🎮</div>
                <div>
                    <h1>NEXUS VAULT</h1>
                    <span class="nav-subtitle">Video Game Database & Collection Manager</span>
                </div>
            </div>

            <div class="nav-controls">
                <button id="addGameBtn" class="btn btn-neon">
                    <span>+ Add New Game</span>
                </button>
            </div>
        </header>

        <!-- Metrics Stats Bar -->
        <section class="stats-grid">
            <div class="stat-card glass-card">
                <span class="stat-label">Total Games</span>
                <span class="stat-value font-mono" id="statTotal">0</span>
            </div>
            <div class="stat-card glass-card">
                <span class="stat-label">Completed</span>
                <span class="stat-value font-mono text-emerald" id="statCompleted">0</span>
            </div>
            <div class="stat-card glass-card">
                <span class="stat-label">Currently Playing</span>
                <span class="stat-value font-mono text-cyan" id="statPlaying">0</span>
            </div>
            <div class="stat-card glass-card">
                <span class="stat-label">Avg Rating</span>
                <span class="stat-value font-mono text-amber" id="statAvgRating">0.0 / 10</span>
            </div>
        </section>

        <!-- Search & Filter Controls -->
        <section class="filter-bar glass-card">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by title, genre, or platform...">
            </div>

            <div class="filter-dropdowns">
                <select id="genreFilter" class="select-control">
                    <option value="ALL">All Genres</option>
                    <option value="Action RPG">Action RPG</option>
                    <option value="Sci-Fi RPG">Sci-Fi RPG</option>
                    <option value="Action Adventure">Action Adventure</option>
                    <option value="Turn-Based RPG">Turn-Based RPG</option>
                    <option value="Rogue-like Action">Rogue-like Action</option>
                    <option value="Metroidvania">Metroidvania</option>
                </select>

                <select id="statusFilter" class="select-control">
                    <option value="ALL">All Statuses</option>
                    <option value="Playing">Playing</option>
                    <option value="Completed">Completed</option>
                    <option value="Wishlist">Wishlist</option>
                </select>
            </div>
        </section>

        <!-- Game Cards Grid Container -->
        <main class="games-grid" id="gamesGrid">
            <!-- Dynamic Game Cards render here -->
        </main>
    </div>

    <!-- Add / Edit Game Modal -->
    <div class="modal-backdrop hidden" id="gameModal">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <h2 id="modalTitle">Add Game to Vault</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="gameForm">
                <input type="hidden" id="gameIdInput">
                <div class="form-body">
                    <div class="form-group">
                        <label for="titleInput">Game Title *</label>
                        <input type="text" id="titleInput" required placeholder="e.g. Elden Ring" class="form-control">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="genreInput">Genre *</label>
                            <input type="text" id="genreInput" required placeholder="e.g. Action RPG" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="platformInput">Platform *</label>
                            <input type="text" id="platformInput" required placeholder="e.g. PC / PS5" class="form-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="ratingInput">Rating (0 - 10) *</label>
                            <input type="number" id="ratingInput" min="0" max="10" step="0.1" value="9.0" required class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="yearInput">Release Year *</label>
                            <input type="number" id="yearInput" value="2024" required class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="statusInput">Collection Status</label>
                        <select id="statusInput" class="form-control">
                            <option value="Playing">Currently Playing</option>
                            <option value="Completed">Completed</option>
                            <option value="Wishlist">Wishlist</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="coverInput">Cover Image URL (Optional)</label>
                        <input type="url" id="coverInput" placeholder="https://images.unsplash.com/..." class="form-control">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-neon">Save Game Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
