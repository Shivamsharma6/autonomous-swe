version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../..:/app

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../../apps/web:/usr/share/nginx/html:ro
