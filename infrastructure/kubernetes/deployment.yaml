apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-swe-api
  labels:
    app: autonomous-swe-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-swe-api
  template:
    metadata:
      labels:
        app: autonomous-swe-api
    spec:
      containers:
      - name: api
        image: autonomous-swe-api:latest
        ports:
        - containerPort: 8000
