global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: autoswe-api
    static_configs:
      - targets: [api:9100]
  - job_name: autoswe-dispatcher
    static_configs:
      - targets: [dispatcher:9100]
  - job_name: autoswe-workers
    static_configs:
      - targets: [workers:9100]
  - job_name: autoswe-sandbox-manager
    metrics_path: /metrics
    static_configs:
      - targets: [sandbox-manager:8090]
